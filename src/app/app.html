<header class="app-header">
  <h1 class="app-title">{{ title }}</h1>
  <nav class="app-nav">
    <a class="app-nav-link" routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a class="app-nav-link" routerLink="/settings" routerLinkActive="active">Settings</a>
  </nav>
</header>

@if (producer.errorMessage()) {
  <div class="app-error" role="alert">
    <p class="app-error-message">{{ producer.errorMessage() }}</p>
    <button type="button" class="app-error-retry" (click)="producer.retry()">Retry</button>
  </div>
}

<main class="app-main">
  <router-outlet />
</main>
